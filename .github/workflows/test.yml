name: Test

on:
  push:
    branches: [ main, claude/pr-ci-check-tdr249 ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.11']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Syntax check with Python
        run: |
          python -m py_compile build.py

      - name: Lint with flake8
        run: |
          # E501: line too long, W503: line break before binary operator (ignored)
          flake8 build.py --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 build.py --count --exit-zero --max-line-length=127 --statistics

      - name: Validate sites.json
        run: python tools/validate_config.py

      - name: Build with stubbed network
        run: python tools/build_smoke_test.py
