name: Update News

on:
  schedule:
    - cron: '0 * * * *' # 毎時0分（UTC）に実行
  workflow_dispatch: # GitHub上から手動実行できるボタンを追加

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Cloudflare のシークレットが設定されていれば Cloudflare Pages へ、
      # なければ GitHub Pages へデプロイする。
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME || 'mysmartnews' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # 記事データはリポジトリにコミットしない。ビルド間で引き継ぐ状態
      # （初回発見時刻とはてブ件数）だけをキャッシュで持ち回る。
      - name: Restore build state
        uses: actions/cache/restore@v4
        with:
          path: data
          key: state-${{ github.run_id }}
          restore-keys: |
            state-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build
        run: python build.py

      - name: Save build state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data
          key: state-${{ github.run_id }}

      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.CLOUDFLARE_PROJECT_NAME }} --branch=main

      - name: Configure GitHub Pages
        if: env.CLOUDFLARE_API_TOKEN == ''
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: env.CLOUDFLARE_API_TOKEN == ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        if: env.CLOUDFLARE_API_TOKEN == ''
        uses: actions/deploy-pages@v4
