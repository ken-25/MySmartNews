<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MyNews">
    <meta name="description" content="カテゴリを選ぶだけで自分好みに並ぶニュースリーダー。設定は端末の中だけに保存されます。">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="style.css">
    <title>MyNews</title>
</head>
<body>
    <header class="topbar">
        <div class="tab-bar" id="tab-bar"></div>
        <button class="gear" id="open-settings">設定</button>
    </header>
    <div class="swipe-container" id="swipe-container">
        <div class="swipe-item"><div class="status" id="status">読み込み中…</div></div>
    </div>
    <div class="sheet" id="settings" hidden>
        <div class="sheet-head">
            <h1 id="settings-title">設定</h1>
            <button class="close" id="close-settings">完了</button>
        </div>
        <p class="hint" id="settings-lead">設定はこの端末の中だけに保存されます。サーバーには送られません。</p>
        <div id="settings-body"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
