<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MyNews">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <title>MyNews</title>
    <style>
        :root {
            --bg: #f2f2f7;
            --card-bg: #ffffff;
            --text: #000000;
            --text-muted: #8e8e93;
            --primary: #007aff;
            --visited: #5856d6;
            --border: #e5e5ea;
            --badge-bg: #e5e5ea;
            --badge-text: #333333;
            --hot: #ff3b30;
            --interest: #ff9500;
            --skeleton: #e5e5ea;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #000000;
                --card-bg: #1c1c1e;
                --text: #ffffff;
                --text-muted: #8e8e93;
                --primary: #0a84ff;
                --visited: #a5a3f0;
                --border: #2c2c2e;
                --badge-bg: #2c2c2e;
                --badge-text: #d1d1d6;
                --hot: #ff453a;
                --interest: #ff9f0a;
                --skeleton: #2c2c2e;
            }
        }

        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0; padding: 0; background: var(--bg); color: var(--text); overflow: hidden;
        }

        /* タブバー */
        .tab-bar {
            display: flex; overflow-x: auto; white-space: nowrap;
            background: var(--card-bg); border-bottom: 1px solid var(--border);
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            scrollbar-width: none; padding-top: env(safe-area-inset-top);
        }
        .tab-bar::-webkit-scrollbar { display: none; }
        .tab {
            padding: 12px 16px; cursor: pointer; color: var(--text-muted);
            font-size: 15px; font-weight: bold; border-bottom: 3px solid transparent;
            transition: color 0.2s; flex-shrink: 0;
        }
        .tab.active { color: var(--primary); border-bottom-color: var(--primary); }

        /* スワイプエリア */
        .swipe-container {
            display: flex; overflow-x: auto; scroll-snap-type: x mandatory;
            scroll-behavior: smooth; width: 100vw; height: 100vh; height: 100dvh;
            scrollbar-width: none; padding-top: calc(45px + env(safe-area-inset-top));
        }
        .swipe-container::-webkit-scrollbar { display: none; }
        .swipe-item {
            width: 100vw; flex-shrink: 0; scroll-snap-align: start; overflow-y: auto;
            -webkit-overflow-scrolling: touch; padding: 15px;
            padding-bottom: calc(30px + env(safe-area-inset-bottom));
        }

        /* セクション見出し */
        .section-title {
            font-size: 13px; font-weight: 700; color: var(--text-muted);
            margin: 18px 4px 8px; letter-spacing: 0.04em;
        }
        .swipe-item > .section-title:first-child { margin-top: 0; }

        /* 記事カード */
        .article {
            background: var(--card-bg); border-radius: 12px; padding: 15px;
            margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            display: block; text-decoration: none; color: inherit;
        }
        .article .title {
            color: var(--text); font-size: 15px; line-height: 1.4;
            font-weight: 500; margin-bottom: 8px;
        }
        .article:visited .title { color: var(--visited); }

        /* ヒーローカード（TOPの1件目） */
        .article.hero { padding: 0; overflow: hidden; }
        .article.hero .thumb { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; background: var(--skeleton); }
        .article.hero .body { padding: 15px; }
        .article.hero .title { font-size: 19px; font-weight: 700; line-height: 1.35; }

        /* 中カード（サムネイル横並び） */
        .article.medium .body { display: flex; gap: 12px; align-items: flex-start; }
        .article.medium .thumb {
            width: 88px; height: 88px; flex-shrink: 0; object-fit: cover;
            border-radius: 8px; background: var(--skeleton);
        }
        .article.medium .text { flex: 1; min-width: 0; }

        .meta {
            display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
            font-size: 11px; color: var(--text-muted);
        }
        .meta .time { color: var(--text-muted); }
        .site-badge { background: var(--badge-bg); padding: 3px 6px; border-radius: 4px; color: var(--badge-text); }
        .badge { padding: 3px 6px; border-radius: 4px; font-weight: 700; }
        .badge.hot { color: #fff; background: var(--hot); }
        .badge.new { color: var(--primary); border: 1px solid var(--primary); }
        .badge.interest { color: #fff; background: var(--interest); }

        .footer { text-align: center; color: var(--text-muted); font-size: 12px; margin-top: 20px; }
        .empty { text-align: center; color: var(--text-muted); font-size: 14px; padding: 40px 0; }
        .status { text-align: center; color: var(--text-muted); font-size: 14px; padding: 60px 20px; }
    </style>
</head>
<body>
    <div class="tab-bar" id="tab-bar"></div>
    <div class="swipe-container" id="swipe-container">
        <div class="swipe-item"><div class="status" id="status">読み込み中…</div></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
